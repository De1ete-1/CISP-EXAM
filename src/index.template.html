<script id="question-data" type="application/json">__QUESTION_DATA__</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('question-data').textContent);
const BY_ID=new Map(BANK.map(q=>[q.id,q]));
const RULES=Object.freeze({count:100,minutes:120,pass:70});
const STORAGE_KEY='cisp-exam-studio-v1';
const icons={home:'M3 10l9-7 9 7M5 9v11h5v-6h4v6h5V9',exam:'M8 4h11v17H5V4h3M9 2h6v4H9zM9 11h6M9 15h6',book:'M12 5C8 3 5 3 2 4v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-6-1-10 1zm0 0v15',wrong:'M9 4H5v17h14V4h-4M9 2h6v4H9zM9 11l6 6m0-6-6 6',history:'M3 4v5h5M3 9a9 9 0 1 1 1 8M12 7v5l3 2',arrow:'M5 12h14m-5-5 5 5-5 5',left:'M15 5l-7 7 7 7',right:'M9 5l7 7-7 7',shield:'M12 2l8 3v6c0 5-8 11-8 11S4 16 4 11V5l8-3zm-4 9 3 3 5-6',check:'M5 12l4 4 10-10',flag:'M5 21V3m0 1c4-3 8 4 14 0v10c-6 4-10-3-14 0',clock:'M12 8v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',search:'M20 20l-5-5m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0',info:'M12 11v6m0-10v.1M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',refresh:'M20 4v6h-6M4 20v-6h6M4 9a8 8 0 0 1 14-4l2 5M4 14l2 5a8 8 0 0 0 14-4',target:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M17 12a5 5 0 1 1-10 0 5 5 0 0 1 10 0m-5 0h.01',close:'M6 6l12 12M18 6 6 18'};
const icon=(name,size='')=>`<svg class="icon" ${size?`style="width:${size}px;height:${size}px"`:''} viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[name]||icons.book}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const letters=['A','B','C','D'];
const fmtDate=(time,full=false)=>new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',...(full?{year:'numeric'}:{}),hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(time));
const duration=ms=>`${Math.floor(Math.max(0,ms)/60000)} 分 ${String(Math.floor(Math.max(0,ms)/1000)%60).padStart(2,'0')} 秒`;
const defaultState=()=>({version:1,active:null,history:[],wrong:{},seen:[]});
function validExam(a){return a&&Array.isArray(a.ids)&&a.ids.length===RULES.count&&new Set(a.ids).size===RULES.count&&a.ids.every(i=>BY_ID.has(i))&&Number.isFinite(a.startedAt)&&Number.isFinite(a.deadline)&&a.deadline===a.startedAt+RULES.minutes*60000&&a.answers&&typeof a.answers==='object'&&!Array.isArray(a.answers)&&Array.isArray(a.flags)&&a.flags.every(i=>a.ids.includes(i))&&Object.entries(a.answers).every(([k,v])=>a.ids.includes(Number(k))&&letters.includes(v))&&Number.isInteger(a.current)&&a.current>=0&&a.current<100;}
let storageAvailable=true;
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultState();const x=JSON.parse(raw);if(x.version!==1)throw new Error('版本不符');const d=defaultState();d.active=validExam(x.active)?x.active:null;d.history=Array.isArray(x.history)?x.history.filter(r=>validExam(r)&&Number.isFinite(r.finishedAt)).slice(0,30):[];d.wrong=x.wrong&&typeof x.wrong==='object'&&!Array.isArray(x.wrong)?Object.fromEntries(Object.entries(x.wrong).filter(([k,v])=>BY_ID.has(Number(k))&&v&&Number.isFinite(v.count)&&typeof v.mastered==='boolean')):{};d.seen=Array.isArray(x.seen)?[...new Set(x.seen.filter(i=>BY_ID.has(i)))]:[];return d;}catch(err){storageAvailable=false;return defaultState();}}
let state=load(),view='home',currentRecord=null,reviewFilter='wrong',reviewIndex=0,libraryId=1,libraryQuery='',libraryVolume='all',reveal=false,wrongFilter='pending',autoNext=false;
let dialogAction=null,toastTimer;
function storageWarning(){if(!storageAvailable)$('storage-alert').innerHTML='<div class="storage-alert" role="alert">浏览器未能读取或保存本地数据。当前仍可练习，关闭页面后进度可能丢失；请使用普通浏览模式。</div>';else $('storage-alert').textContent='';}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageAvailable=true;$('save-status').textContent='进度已保存';}catch(err){storageAvailable=false;$('save-status').textContent='暂未保存';}storageWarning();}
function notify(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500);}
function modal(title,text,confirm,onConfirm,cancel='取消'){dialogAction=onConfirm;$('dialog-title').textContent=title;$('dialog-description').textContent=text;$('dialog-confirm').textContent=confirm;$('dialog-cancel').textContent=cancel;$('dialog').showModal();}
$('dialog-cancel').onclick=()=>$('dialog').close();$('dialog-confirm').onclick=()=>{const fn=dialogAction;$('dialog').close();dialogAction=null;if(fn)fn();};$('dialog').addEventListener('close',()=>{dialogAction=null;});
function score(record){return record.ids.reduce((sum,id)=>sum+(record.answers[id]===BY_ID.get(id).answer?1:0),0);}
function answered(record){return record.ids.filter(id=>letters.includes(record.answers[id])).length;}
function wrongEntries(){return Object.keys(state.wrong).map(Number).filter(id=>BY_ID.has(id));}
function pendingWrong(){return wrongEntries().filter(id=>!state.wrong[id].mastered);}
function average(){return state.history.length?Math.round(state.history.reduce((n,r)=>n+score(r),0)/state.history.length):null;}
function randomSample(pool,count){const arr=[...pool];for(let i=arr.length-1;i>0;i--){const range=i+1;const bound=Math.floor(4294967296/range)*range;let value;do{const b=new Uint32Array(1);crypto.getRandomValues(b);value=b[0];}while(value>=bound);const j=value%range;[arr[i],arr[j]]=[arr[j],arr[i]];}return arr.slice(0,count);}
function nav(){const items=[['home','home','学习总览'],['exam','exam','模拟考试'],['wrong','wrong','错题本'],['library','book','题库浏览'],['history','history','考试记录']];$('nav').innerHTML=items.map(([id,ic,label])=>`<button class="nav-item ${(view===id||(view==='review'&&id==='history'))?'active':''}" data-action="nav" data-view="${id}" title="${label}" ${view===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span>${id==='wrong'&&pendingWrong().length?`<span class="badge">${pendingWrong().length}</span>`:''}</button>`).join('');$('crumb-title').textContent=({home:'学习总览',exam:'模拟考试',wrong:'错题本',library:'题库浏览',history:'考试记录',review:'考试复盘',about:'使用说明'})[view];}
function go(next){if(next==='exam'){if(state.active){view='exam';}else{view='home';render();startExam();return;}}else{view=next;}if(next==='library'||next==='wrong'){libraryQuery='';libraryVolume='all';reveal=false;studyAnswer=null;}render();window.scrollTo({top:0,behavior:'auto'});}
function startExam(){if(state.active){modal('已有一场考试进行中',`已完成 ${answered(state.active)} / 100 题。继续可从保存的位置答题；重新组卷会放弃本场尚未提交的作答。`,'重新组卷',()=>makeExam(),'返回');return;}makeExam();}
function makeExam(){const now=Date.now();state.active={id:crypto.randomUUID?crypto.randomUUID():String(now),ids:randomSample(BANK.map(q=>q.id),100),answers:{},flags:[],current:0,startedAt:now,deadline:now+120*60000};view='exam';persist();render();window.scrollTo({top:0,behavior:'auto'});}
function requestSubmit(){if(!state.active)return;const n=100-answered(state.active);modal('确认提交本次考试？',n?`还有 ${n} 道题未作答，未答题按 0 分计入。交卷后结束本场考试，并展示成绩与逐题解析。`:'已完成全部 100 道题。交卷后展示成绩与逐题解析。','确认交卷',()=>submitExam(false),'继续答题');}
function submitExam(timeout=false){if(!state.active)return;const a=state.active;const rec={...a,answers:{...a.answers},flags:[...a.flags],finishedAt:Math.min(Date.now(),a.deadline),timeout};for(const id of a.ids){if(a.answers[id]!==BY_ID.get(id).answer){const prior=state.wrong[id]||{count:0};state.wrong[id]={count:prior.count+1,lastWrong:Date.now(),lastAnswer:a.answers[id]||null,mastered:false};}}state.history.unshift(rec);state.history=state.history.slice(0,30);state.active=null;state.seen=[...new Set([...state.seen,...a.ids])];currentRecord=rec;reviewFilter='wrong';reviewIndex=0;view='review';persist();if($('dialog').open)$('dialog').close();render();window.scrollTo({top:0,behavior:'auto'});if(timeout)notify('考试时间已到，已自动交卷并保存成绩。');}
function chooseAnswer(letter){if(view!=='exam'||!state.active)return;if(Date.now()>=state.active.deadline){submitExam(true);return;}const a=state.active,id=a.ids[a.current];a.answers[id]=letter;state.seen=[...new Set([...state.seen,id])];if(autoNext&&a.current<99)a.current++;persist();render();}
function jumpQuestion(index){if(!state.active)return;if(Date.now()>=state.active.deadline){submitExam(true);return;}state.active.current=Math.min(99,Math.max(0,index));persist();render();}
function footer(){return '<footer class="footer"><span>522 道题 · 独立组卷 · 持续积累</span><button class="text-link" data-action="about">题库来源与使用说明 '+icon('right',12)+'</button></footer>';}

ata-action="${state.active?'resume':'start'}"><div class="practice-icon">${icon('exam')}</div><div><h3>全真模拟</h3><p>随机 100 题，保持考试手感<br>120 分钟，检验整体水平</p></div><span class="arrow">${icon('arrow',17)}</span></button><button class="practice-card card" data-action="nav" data-view="wrong"><div class="practice-icon">${icon('wrong')}</div><div><h3>错题巩固</h3><p>读懂每一次错误背后的知识点<br>逐题解析，把薄弱处练扎实</p></div><span class="arrow">${icon('arrow',17)}</span></button><button class="practice-card card" data-action="nav" data-view="library"><div class="practice-icon">${icon('book')}</div><div><h3>题库浏览</h3><p>按原题号查找与顺序学习<br>522 道题，随时回顾</p></div><span class="arrow">${icon('arrow',17)}</span></button></div><div class="home-bottom"><section class="bank-progress card"><div class="section-head"><h2>题库学习进度</h2><span class="muted">已覆盖 ${Math.round(state.seen.length/522*100)}%</span></div>${[1,2,3,4,5,6].map(n=>{const size=n===6?22:100,done=state.seen.filter(id=>Math.ceil(id/100)===n).length;return `<div class="volume"><span class="volume-name">第 ${n} 组</span><div class="track" role="progressbar" aria-label="第 ${n} 组学习进度" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${size}"><span style="width:${done/size*100}%"></span></div><span class="volume-num">${done} / ${size}</span></div>`;}).join('')}<p style="font-size:9px;color:#acb5af;margin-top:15px">按每 100 个原题号分组 · 作答或完成考试后计入覆盖</p></section><section class="method-card card"><div class="section-head"><h2>${last?'最近一次考试':'让每次复盘更有效'}</h2><span class="muted">${last?fmtDate(last.finishedAt):'LEARNING NOTES'}</span></div>${last?`<div style="font-size:39px;font-weight:650;color:var(--green);margin:15px 0 4px">${score(last)}<span style="font-size:12px;color:#92a397;font-weight:400;margin-left:6px">/ 100</span></div><p class="small muted">${score(last)>=70?'已达到通过线，继续保持。':'距离通过还差 '+(70-score(last))+' 分，从错题开始巩固。'}</p><button class="btn btn-secondary btn-sm" style="margin-top:20px" data-action="record" data-id="${esc(last.id)}">回顾本次考试 ${icon('arrow',14)} function statCard(ic,label,value,unit,color){return `<div class="stat-card card"><div class="stat-icon ${color}">${icon(ic,20)}</div><div><div class="stat-caption">${label}</div><div class="stat-num mono">${value}<span class="stat-unit">${unit}</span></div></div></div>`;}
function figures(q,role='question'){const imgs=q.images.filter(i=>i.role===role);return imgs.length?`<div class="q-figures">${imgs.map((i,n)=>`<img class="q-figure" src="${i.src}" alt="原题 ${q.id} 的${role==='question'?'题目':'解析'}插图 ${n+1}" loading="lazy">`).join('')}</div>`:'';}
function optionsHtml(q,selected,show=false){return `<div class="options" ${!show?'role="radiogroup" aria-label="选择答案"':''}>${q.options.map((text,i)=>{const l=letters[i],classes=show?(l===q.answer?'correct':selected===l?'incorrect':''):(selected===l?'selected':'');return `<${show?'div':'button'} class="option ${classes} ${show?'static':''}" ${show?'':`role="radio" aria-checked="${selected===l}" data-action="answer" data-answer="${l}"`}><span class="option-key">${l}</span><span>${esc(text)}</span>${show&&(l===q.answer||l===selected)?`<span class="option-status">${l===q.answer?'正确答案':'你的选择'}</span>`:''}</${show?'div':'button'}>`;}).join('')}</div>`;}
function sourceLinks(q){const legacy=q.textbookSources?.length?'':q.references.map(r=>`<a href="${SOURCE_TEXTBOOK}#page=${r.pdfPage}" target="_blank" rel="noopener">题库所引教材 P${r.page}（PDF ${r.pdfPage} 页）↗</a>`).join('');return `<div class="source-line"><span>${esc(q.explanationSource)}</span><a href="${SOURCE_QUESTIONS}#page=${q.sourcePage}" target="_blank" rel="noopener">原题 PDF 第 ${q.sourcePage} 页 ↗</a>${legacy}${(q.links||[]).map(([label,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`).join('')}</div>`;}
function pageRange(start,end){return start===end?String(start):`${start}–${end}`;}
function textbookSourcesHtml(q){
  const refs=q.textbookSources||[];
  if(!refs.length)return '';
  return `<section class="textbook-sources" aria-label="教材参考来源"><div class="textbook-heading">${icon('book',16)}<strong>教材参考</strong><span>注册信息安全专业人员培训教材</span></div>${refs.map(r=>`<article class="textbook-reference"><div class="textbook-ref-head"><span class="textbook-kind ${r.kind==='related'?'related':''}">${r.kind==='related'?'相关章节':'知识点出处'}</span><span class="textbook-chapter">${esc(r.chapter)}</span></div><div class="textbook-location"><span>${esc(r.section)}</span><a class="textbook-page" href="${SOURCE_TEXTBOOK}#page=${r.pdfPage}" target="_blank" rel="noopener" aria-label="打开教材 PDF 第 ${r.pdfPage} 页">教材 P${pageRange(r.page,r.endPage)} · PDF 第 ${pageRange(r.pdfPage,r.pdfEndPage)} 页 ↗</a></div>${r.note?`<p class="textbook-note">${esc(r.note)}</p>`:''}</article>`).join('')}<p class="textbook-help">“知识点出处”用于核对对应概念；“相关章节”表示未定位到该题细节的直接依据。题库答案不等同于教材结论。</p></section>`;
}

function explanationHtml(q,selected,showSelection=true){return `<section class="explanation"><h3>${icon('book',16)} 解题解析</h3>${showSelection?`<div class="answer-summary"><span>你的答案 <strong class="${selected!==q.answer?'wrong-text':''}">${selected||'未作答'}</strong></span><span>题库答案 <strong>${q.answer}</strong></span></div>`:''}<p>${esc(q.explanation)}</p>${figures(q,'explanation')}${sourceLinks(q)}${textbookSourcesHtml(q)}</section>${q.note?`<aside class="note"><strong>题库核对备注</strong><br>${esc(q.note)}</aside>`:''}`;}
function renderExam(){const a=state.active;if(!a)return renderHome();const q=BY_ID.get(a.ids[a.current]),n=answered(a),flag=a.flags.includes(q.id);return `<div class="exam-head"><div class="exam-title"><h1>模拟考试</h1><span class="tag">100 道单选 · 70 分通过</span></div><div class="timer" id="timer" role="timer" aria-label="考试剩余时间">${icon('clock',18)}<strong id="time-left" class="mono">--:--:--</strong></div></div><div class="exam-layout"><div><section class="q-card card"><div class="q-top"><div class="q-number">QUESTION <b>${String(a.current+1).padStart(2,'0')}</b> / 100</div><span class="tag">单选题 · 1 分</span></div><h2 class="q-stem">${esc(q.stem)}</h2>${figures(q)}${optionsHtml(q,a.answers[q.id])}<div class="q-tools"><button class="btn btn-secondary btn-sm flag ${flag?'active':''}" data-action="flag" aria-pressed="${flag}">${icon('flag',15)}${flag?'已标记存疑':'标记存疑'}</button><div class="q-tools-right"><button class="btn btn-secondary" data-action="prev" ${a.current===0?'disabled':''}>${icon('left',14)} 上一题</button><button class="btn btn-primary" data-action="${a.current===99?'submit':'next'}">${a.current===99?'检查并交卷':'下一题'} ${icon('right',14)}</button></div></div></section><div class="keyboard-hint"><span>快捷键 <span class="kbd">A–D</span> 选择答案 · <span class="kbd">←</span> <span class="kbd">→</span> 切换题目</span><button class="text-link" data-action="clear-answer">清除本题选择</button></div></div><aside class="answer-panel card"><div class="panel-title"><strong>答题卡</strong><span>已答 <b style="color:var(--green)">${n}</b> / 100</span></div><div class="track"><span style="width:${n}%"></span></div><div class="answer-grid">${a.ids.map((id,i)=>`<button class="q-dot ${a.answers[id]?'answered':''} ${i===a.current?'current':''} ${a.flags.includes(id)?'marked':''}" data-action="jump" data-index="${i}" aria-label="第 ${i+1} 题，${a.answers[id]?'已答':'未答'}${a.flags.includes(id)?'，已标记':''}" ${i===a.current?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="legend"><span><i></i>已答</span><span><i class="blank"></i>未答</span><span><i class="mark"></i>存疑 ${a.flags.length}</span></div><div class="panel-foot"><label class="auto-next"><input type="checkbox" id="auto-next" ${autoNext?'checked':''}>选择答案后自动下一题</label><button class="btn btn-primary" data-action="submit">提交试卷 ${icon('check',16)}</button><button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" data-action="clear-answer">清除本题选择</button><div class="saved-note">${storageAvailable?'作答自动保存 · 到时自动交卷':'当前进度暂未保存，请保持页面开启'}</div></div></aside></div>${footer()}`;}
function filteredReview(){if(!currentRecord)return [];return currentRecord.ids.filter(id=>reviewFilter==='all'||(reviewFilter==='flagged'?currentRecord.flags.includes(id):currentRecord.answers[id]!==BY_ID.get(id).answer));}
function renderReview(){const r=currentRecord;if(!r)return renderHistory();const sc=score(r),n=answered(r),list=filteredReview();reviewIndex=Math.max(0,Math.min(reviewIndex,list.length-1));const q=BY_ID.get(list[reviewIndex]);return `<section class="result-hero card ${sc<70?'failed':''}"><div class="score-circle" style="--score:${sc}"><div class="score-inner"><strong>${sc}</strong><small>本次得分 / 100</small></div></div><div class="result-text"><div class="eyebrow">EXAM COMPLETED</div><h1>${sc>=70?'通过，努力有了回响。':'再进一步，离通过更近。'}</h1><p>${fmtDate(r.finishedAt,true)} · 用时 ${duration(r.finishedAt-r.startedAt)} · ${r.timeout?'时间到自动交卷':'主动交卷'}</p></div><div class="result-actions"><button class="btn btn-secondary btn-sm" data-action="export" data-id="${esc(r.id)}">${icon('download',14)} 导出复盘</button><button class="btn btn-primary btn-sm" data-action="start">再考一次 ${icon('arrow',14)}</button></div></section><div class="stats-grid" style="margin-top:0">${statCard('check','答对',sc,'题','')}${statCard('wrong','答错',n-sc,'题','rose')}${statCard('book','未作答',100-n,'题','amber')}${statCard('target','通过标准',70,'分','blue')}</div><div class="filterbar"><div class="tabs" role="group" aria-label="复盘筛选">${[['wrong','错题与未答',100-sc],['all','全部',100],['flagged','存疑',r.flags.length]].map(([id,label,count])=>`<button class="tab ${reviewFilter===id?'active':''}" data-action="review-filter" data-filter="${id}" aria-pressed="${reviewFilter===id}">${label} ${count}</button>`).join('')}</div><span class="small muted">${list.length?'逐题复盘 · '+(reviewIndex+1)+' / '+list.length:'复盘已就绪'}</span></div>${q?`<div class="review-layout"><div><section class="q-card card"><div class="q-top"><div class="q-number">试卷第 <b>${r.ids.indexOf(q.id)+1}</b> 题 <span style="margin-left:8px">原题 #${q.id}</span></div><span class="tag">${r.answers[q.id]===q.answer?'回答正确':r.answers[q.id]?'回答错误':'未作答'}</span></div><h2 class="q-stem">${esc(q.stem)}</h2>${figures(q)}${optionsHtml(q,r.answers[q.id],true)}${explanationHtml(q,r.answers[q.id])} function emptyState(title,subtitle,buttonText='',action='start'){return `<section class="empty card"><div class="empty-icon">${icon('check',29)}</div><h2>${title}</h2><p>${subtitle}</p>${buttonText?`<button class="btn btn-primary" data-action="${action}">${buttonText} ${icon('arrow',15)}</button>`:''}</section>`;}

lass="q-number">原题 <b>#${q.id}</b> <span>${isWrong?'累计错 '+progress.count+' 次':'/ 522'}</span></div><span class="tag">${isWrong&&progress.mastered?'已掌握':'单项选择题'}</span></div><h2 class="q-stem">${esc(q.stem)}</h2>${figures(q)}${optionsHtml(q,reveal?(studyAnswer||null):studyAnswer,reveal)}${reveal?explanationHtml(q,studyAnswer,Boolean(studyAnswer)):''}<div class="q-tools"><button class="btn ${reveal?'btn-secondary':'btn-primary'} btn-sm" data-action="reveal">${icon(reveal?'refresh':'book',15)} ${reveal?'重新自测':'查看答案与解析'}</button>${isWrong&&reveal?`<button class="btn btn-secondary btn-sm" data-action="master" data-id="${q.id}">${icon('check',14)} ${progress.mastered?'移回待巩固':'标记已掌握'}</button>`:''}<div class="q-tools-right"><button class="btn btn-secondary btn-sm" data-action="library-prev" ${list.indexOf(q.id)===0?'disabled':''}>${icon('left',14)}</button><button class="btn btn-secondary btn-sm" data-action="library-next" ${list.indexOf(q.id)===list.length-1?'disabled':''}>${icon('right',14)}</button></div></div></section></div>`:emptyState(libraryQuery?'没有找到相关题目':isWrong?'这里暂时没有待巩固的错题。':'暂时没有题目',libraryQuery?'试试其他关键词或原题号。':isWrong?'完成一次模拟考试后，错题和未答题会自动收录。':'切换题目分组试试。',libraryQuery?'':'开始模拟考试')}${footer()}`;}
let studyAnswer=null;
function renderHistory(){return `${pageHead('EVERY ATTEMPT COUNTS','看得见的，每一次进步。','保留最近 30 场已提交的考试，可随时回到当次试卷复盘。',`<button class="btn btn-primary btn-sm" data-action="start">开始模拟考试 ${icon('arrow',14)}</button>`)}${state.history.length?`<div class="stats-grid">${statCard('exam','完成模拟考',state.history.length,'场','')}${statCard('check','通过次数',state.history.filter(r=>score(r)>=70).length,'次','blue')}${statCard('target','平均成绩',average(),'分','amber')}${statCard('flag','最好成绩',Math.max(...state.history.map(score)),'分','rose')}</div><section class="history-card card"><div class="table-wrap"><table><thead><tr><th>考试时间</th><th>得分</th><th>结果</th><th>已答题目</th><th>用时</th><th>复盘</th></tr></thead><tbody>${state.history.map(r=>`<tr><td>${fmtDate(r.finishedAt,true)}<br><small style="color:#a8b4ac">${r.timeout?'自动交卷':'主动交卷'}</small></td><td><strong>${score(r)}</strong><span style="font-size:10px;color:#a2afa7"> / 100</span></td><td><span class="${score(r)>=70?'status-pass':'status-fail'}">${score(r)>=70?'通过':'未通过'}</span></td><td>${answered(r)} / 100</td><td>${duration(r.finishedAt-r.startedAt)}</td><td><button class="btn btn-secondary btn-sm" data-action="record" data-id="${esc(r.id)}">查看解析 ${icon('right',13)}</button></td></tr>`).join('')}</tbody></table></div></section>`:emptyState('你的第一场模拟考，在这里开始。','认真作答的每一场考试，都会留下可回顾的记录。','开始模拟考试')}${footer()}`;}
function renderAbout(){const supplemented=BANK.filter(q=>q.explanationSource==='学习补充').length,figuresCount=BANK.reduce((n,q)=>n+q.images.length,0);return `${pageHead('ABOUT THIS WORKSPACE','安心练习，清楚每一份依据。','本地 HTML · 无需安装 · 无需联网')}<section class="about card"><h2>规则与题库</h2><p>每场从 522 道题中独立随机抽取 100 道，不重复抽取同一原题号。全部为单项选择题，每题 1 分，满分 100 分，70 分及以上通过，考试时长 120 分钟。此处按你的要求均匀抽题，未按 CISE / CISO 知识域权重分配。</p><p>题库来自你提供的《题库1-522题.pdf》，已保留所有 522 个原题号、四个选项、题库答案和 ${figuresCount} 张原始插图。相似或重复内容可能对应不同原题号。正式考试规则可参考 <a href="https://www.sangfor.com.cn/security-service/safety-training-service/cisp" target="_blank" rel="noopener">CISP 培训考试说明 ↗</a>。</p><h2>解析如何整理</h2><p>优先沿用题库原解析，并参考所给培训教材的相关内容和公开技术资料，为 ${supplemented} 道题补充了针对性的学习说明。补充内容显示为“学习补充”；每题解析均补充了教材章节、教材页码和 PDF 页码。“知识点出处”表示对应概念在教材中的位置；未定位到题目细节的，明确标为“相关章节”并说明引用范围。这些参考不用于证明题库答案必然正确。</p><div class="note">题库中存在答案争议、历史标准或表述不严谨的题目。评分统一遵循所给 PDF 答案；已发现的问题会在交卷解析或学习模式中单独显示核对备注。法律、政策和技术题按原题的历史背景理解。补充解析供复习使用，可结合授课教师说明核对。</div><h2>本地保存与使用</h2><ul><li>选题、作答、存疑标记和截止时间自动保存到当前浏览器。切换页面、刷新或关闭后，剩余考试时间仍继续计算。</li><li>再次打开时若截止时间已过，会自动交卷。操作系统时钟调整会影响本地计时。</li><li>成绩记录保留最近 30 场；错题本单独积累，可标记已掌握。清理浏览器数据会清除本地记录。</li><li>错题本也收录未答题；浏览题库时选择后点击解析可自测，不计入模拟考成绩。</li><li>原 PDF 链接使用相对路径。如需跳转原文，将题库和教材 PDF 放在 HTML 同一目录；未放置 PDF 时仍可正常考试和查看内嵌解析。</li><li>HTML 已内嵌完整题库与插图，可单文件离线运行。更换浏览器或移动文件可能影响浏览器对本地存储的分区，建议固定使用同一路径。</li></ul><details><summary>已标记的题库核对项（${BANK.filter(q=>q.note).length} 题）</summary>${BANK.filter(q=>q.note).map(q=>`<p style="font-size:11px;margin-top:12px"><strong>原题 #${q.id}</strong> · ${esc(q.note)}</p>`).join('')}</details><button class="btn btn-secondary btn-sm" style="margin-top:25px" data-action="nav" data-view="home">返回学习总览 ${icon('arrow',14)}</button></section>${footer()}`;}
function render(){nav();$('app').innerHTML=({home:renderHome,exam:renderExam,review:renderReview,library:()=>renderLibrary(false),wrong:()=>renderLibrary(true),history:renderHistory,about:renderAbout})[view]();tick();}
function tick(){if(!state.active)return;const diff=state.active.deadline-Date.now();if(diff<=0){submitExam(true);return;}const t=$('time-left');if(t){const sec=Math.ceil(diff/1000);t.textContent=[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(n=>String(n).padStart(2,'0')).join(':');$('timer').classList.toggle('urgent',diff<10*60000);}}
function exportReview(id){const rec=state.history.find(r=>r.id===id)||currentRecord;if(!rec)return;const wrongs=rec.ids.filter(i=>rec.answers[i]!==BY_ID.get(i).answer),lines=['# CISP 模拟考试复盘','',`考试时间：${fmtDate(rec.finishedAt,true)}`,`成绩：${score(rec)} / 100（${score(rec)>=70?'通过':'未通过'}）`,`用时：${duration(rec.finishedAt-rec.startedAt)}`,`错题与未答：${wrongs.length} 题`,'','评分依据：所给题库 PDF 标准答案。',''];for(const id of wrongs){const q=BY_ID.get(id);lines.push(`## 试卷第 ${rec.ids.indexOf(id)+1} 题 · 原题 #${id}`,'',q.stem,'',...q.options.map((s,i)=>`${letters[i]}. ${s}`),'',`你的答案：${rec.answers[id]||'未作答'}；题库答案：${q.answer}`,'',`解析（${q.explanationSource}）：${q.explanation}`,...(q.note?['',`核对备注：${q.note}`]:[]),'',`来源：题库 PDF 第 ${q.sourcePage} 页`,'',...textbookSourceLines(q),...(q.images.length?['原题包含插图，请在 HTML 或 PDF 中查看。']:[]),'');}const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CISP复盘-${new Date(rec.finishedAt).toISOString().slice(0,10)}-${score(rec)}分.md`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('已导出本次考试的错题与解析。');}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;if(el.tagName==='A')event.preventDefault();const action=el.dataset.action;if(action==='nav'){studyAnswer=null;go(el.dataset.view);}else if(action==='start')startExam();else if(action==='resume'){view='exam';render();}else if(action==='answer'){if(view==='exam')chooseAnswer(el.dataset.answer);else if((view==='library'||view==='wrong')&&!reveal){studyAnswer=el.dataset.answer;state.seen=[...new Set([...state.seen,libraryId])];persist();render();}}else if(action==='flag'&&state.active){const id=state.active.ids[state.active.current];state.active.flags=state.active.flags.includes(id)?state.active.flags.filter(x=>x!==id):[...state.active.flags,id];persist();render();}else if(action==='prev')jumpQuestion(state.active.current-1);else if(action==='next')jumpQuestion(state.active.current+1);else if(action==='jump')jumpQuestion(Number(el.dataset.index));else if(action==='submit')requestSubmit();else if(action==='clear-answer'&&state.active){delete state.active.answers[state.active.ids[state.active.current]];persist();render();}else if(action==='record'){currentRecord=state.history.find(r=>r.id===el.dataset.id);if(currentRecord){view='review';reviewIndex=0;reviewFilter='wrong';render();window.scrollTo({top:0,behavior:'auto'});}}else if(action==='review-filter'||action==='review-all'){reviewFilter=el.dataset.filter||'all';reviewIndex=0;render();}else if(action==='review-prev'||action==='review-next'){reviewIndex+=action==='review-prev'?-1:1;render();window.scrollTo({top:270,behavior:'auto'});}else if(action==='review-jump'){reviewIndex=Number(el.dataset.index);render();}else if(action==='library-q'){libraryId=Number(el.dataset.id);reveal=false;studyAnswer=null;render();}else if(action==='library-prev'||action==='library-next'){const list=libraryPool(),i=list.indexOf(libraryId);libraryId=list[i+(action==='library-prev'?-1:1)];reveal=false;studyAnswer=null;render();}else if(action==='reveal'){reveal=!reveal;if(!reveal)studyAnswer=null;render();}else if(action==='wrong-filter'){wrongFilter=el.dataset.filter;reveal=false;studyAnswer=null;render();}else if(action==='master'){const id=Number(el.dataset.id);state.wrong[id].mastered=!state.wrong[id].mastered;persist();reveal=false;studyAnswer=null;render();notify(state.wrong[id].mastered?'已标记掌握，继续巩固下一题。':'已移回待巩固。');}else if(action==='about'){view='about';render();}else if(action==='export')exportReview(el.dataset.id);});
document.addEventListener('input',event=>{if(event.target.id==='library-search'){const pos=event.target.selectionStart;libraryQuery=event.target.value;reveal=false;studyAnswer=null;render();const input=$('library-search');input.focus();if(input.type!=='search')input.setSelectionRange(pos,pos);}});
document.addEventListener('change',event=>{if(event.target.id==='volume-filter'){libraryVolume=event.target.value;reveal=false;studyAnswer=null;render();}if(event.target.id==='auto-next')autoNext=event.target.checked;});
document.addEventListener('keydown',event=>{if(view!=='exam'||!state.active||$('dialog').open||event.ctrlKey||event.metaKey||event.altKey||event.target.matches('input,textarea,select,[contenteditable="true"]'))return;const key=event.key.toUpperCase();if(letters.includes(key)||['1','2','3','4'].includes(key)){event.preventDefault();chooseAnswer(letters.includes(key)?key:letters[Number(key)-1]);}else if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();jumpQuestion(state.active.current+(event.key==='ArrowRight'?1:-1));}});
window.addEventListener('hashchange',()=>{if(location.hash==='#home')go('home');});
document.addEventListener('visibilitychange',tick);window.addEventListener('pageshow',tick);setInterval(tick,1000);
$('brand-icon').innerHTML=icon('check',23);$('today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());storageWarning();render();
</script>
</body></html>
